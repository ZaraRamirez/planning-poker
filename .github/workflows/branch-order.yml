name: branch-order
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Solo se permite develop -> main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Solo PRs desde develop pueden entrar a main. Origen actual: $HEAD_REF"
            exit 1
          fi
          echo "Origen valido: develop"
